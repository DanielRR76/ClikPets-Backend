openapi: 3.0.3
info:
    title: Get a Pet API
    version: 1.0.0
    description: >-
        API para cadastro e adoção de pets. / API for pet registration and adoption.
servers:
    - url: /
      description: Servidor atual / Current server
tags:
    - name: Pets
      description: Consulta e gerenciamento de pets. / Pet lookup and management.
    - name: Usuários / Users
      description: Cadastro, autenticação e gerenciamento de usuários. / User registration, authentication, and management.
paths:
    /pets:
        get:
            tags: [Pets]
            summary: Listar pets / List pets
            description: Retorna todos os pets disponíveis na listagem atual. / Returns all pets in the current listing.
            responses:
                '200':
                    description: Pets retornados / Pets returned
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PetListResponse'
                '500':
                    $ref: '#/components/responses/ServerError'

    /pets/colors:
        get:
            tags: [Pets]
            summary: Listar cores válidas / List valid colors
            description: Retorna as cores aceitas para pets. / Returns the accepted pet colors.
            responses:
                '200':
                    description: Cores retornadas / Colors returned
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [validColors]
                                properties:
                                    validColors:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/PetColor'

    /pets/create:
        post:
            tags: [Pets]
            summary: Cadastrar pet / Create a pet
            description: Cria um pet para o usuário autenticado. Envie de 1 a 5 imagens. / Creates a pet for the authenticated user. Upload 1 to 5 images.
            security:
                - AccessTokenCookie: []
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            $ref: '#/components/schemas/PetCreateRequest'
            responses:
                '201':
                    description: Pet criado / Pet created
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HttpResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '409':
                    $ref: '#/components/responses/Conflict'
                '500':
                    $ref: '#/components/responses/ServerError'

    /pets/mypets:
        get:
            tags: [Pets]
            summary: Listar meus pets / List my pets
            description: Retorna os pets do usuário autenticado. / Returns pets owned by the authenticated user.
            security:
                - AccessTokenCookie: []
            responses:
                '200':
                    description: Pets retornados / Pets returned
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PetListResponse'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '500':
                    $ref: '#/components/responses/ServerError'

    /pets/myadoptions:
        get:
            tags: [Pets]
            summary: Listar minhas adoções / List my adoptions
            description: Retorna os pets associados às adoções do usuário autenticado, incluindo os dados do dono quando disponíveis. / Returns pets associated with the authenticated user's adoptions, including owner details when available.
            security:
                - AccessTokenCookie: []
            responses:
                '200':
                    description: Adoções retornadas / Adoptions returned
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PetListResponse'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '500':
                    $ref: '#/components/responses/ServerError'

    /pets/{id}:
        parameters:
            - $ref: '#/components/parameters/Id'
        get:
            tags: [Pets]
            summary: Consultar pet / Get a pet
            description: Retorna um pet e os dados do dono. / Returns a pet and its owner's details.
            responses:
                '200':
                    description: Pet retornado / Pet returned
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HttpResponse'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/ServerError'
        delete:
            tags: [Pets]
            summary: Excluir pet / Delete a pet
            description: Exclui um pet pertencente ao usuário autenticado. / Deletes a pet owned by the authenticated user.
            security:
                - AccessTokenCookie: []
            responses:
                '200':
                    description: Pet excluído / Pet deleted
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MessageResponse'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/ServerError'
        patch:
            tags: [Pets]
            summary: Atualizar pet / Update a pet
            description: Atualiza os campos enviados de um pet do usuário autenticado. As imagens são opcionais; envie até 5 no campo images. / Updates supplied fields for a pet owned by the authenticated user. Images are optional; upload up to 5 in the images field.
            security:
                - AccessTokenCookie: []
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            $ref: '#/components/schemas/PetUpdateRequest'
            responses:
                '200':
                    description: Pet atualizado / Pet updated
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MessageResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/ServerError'

    /pets/schedule/{id}:
        parameters:
            - $ref: '#/components/parameters/Id'
        patch:
            tags: [Pets]
            summary: Agendar adoção / Schedule an adoption
            description: Agenda a adoção do pet pelo usuário autenticado. / Schedules the pet for adoption by the authenticated user.
            security:
                - AccessTokenCookie: []
            responses:
                '200':
                    description: Adoção agendada / Adoption scheduled
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MessageResponse'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/NotFound'
                '422':
                    $ref: '#/components/responses/UnprocessableEntity'
                '500':
                    $ref: '#/components/responses/ServerError'

    /pets/complete/{id}:
        parameters:
            - $ref: '#/components/parameters/Id'
        patch:
            tags: [Pets]
            summary: Concluir adoção / Complete an adoption
            description: Marca como concluída a adoção de um pet pertencente ao usuário autenticado. / Marks adoption as complete for a pet owned by the authenticated user.
            security:
                - AccessTokenCookie: []
            responses:
                '200':
                    description: Adoção concluída / Adoption completed
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MessageResponse'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/ServerError'

    /users/register:
        post:
            tags: [Usuários / Users]
            summary: Cadastrar usuário / Register a user
            description: Cria uma conta e define o cookie HttpOnly accessToken. / Creates an account and sets the HttpOnly accessToken cookie.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UserCreateRequest'
            responses:
                '201':
                    description: Usuário cadastrado e cookie de autenticação definido / User registered and authentication cookie set
                    headers:
                        Set-Cookie:
                            $ref: '#/components/headers/AccessTokenCookie'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HttpResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '409':
                    $ref: '#/components/responses/Conflict'
                '500':
                    $ref: '#/components/responses/ServerError'

    /users/login:
        post:
            tags: [Usuários / Users]
            summary: Entrar / Log in
            description: Autentica o usuário e define o cookie HttpOnly accessToken. / Authenticates the user and sets the HttpOnly accessToken cookie.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LoginRequest'
            responses:
                '200':
                    description: Login realizado e cookie de autenticação definido / Login successful and authentication cookie set
                    headers:
                        Set-Cookie:
                            $ref: '#/components/headers/AccessTokenCookie'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HttpResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/ServerError'

    /users/logout:
        post:
            tags: [Usuários / Users]
            summary: Sair / Log out
            description: Limpa o cookie accessToken do cliente. / Clears the client's accessToken cookie.
            security:
                - AccessTokenCookie: []
            responses:
                '200':
                    description: Sessão encerrada / Logged out
                    headers:
                        Set-Cookie:
                            description: Cookie accessToken expirado / Expired accessToken cookie
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MessageResponse'
                '401':
                    $ref: '#/components/responses/Unauthorized'

    /users/checkuser:
        get:
            tags: [Usuários / Users]
            summary: Verificar usuário autenticado / Check authenticated user
            description: Retorna os dados do usuário associado ao cookie de autenticação. / Returns the user associated with the authentication cookie.
            security:
                - AccessTokenCookie: []
            responses:
                '200':
                    description: Usuário autenticado / Authenticated user
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HttpResponse'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/ServerError'

    /users/{id}:
        parameters:
            - $ref: '#/components/parameters/Id'
        get:
            tags: [Usuários / Users]
            summary: Consultar usuário / Get a user
            description: Retorna os dados públicos de um usuário. / Returns a user's public details.
            responses:
                '200':
                    description: Usuário retornado / User returned
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HttpResponse'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/ServerError'

    /users/edit:
        patch:
            tags: [Usuários / Users]
            summary: Editar usuário / Edit a user
            description: Atualiza os campos enviados do usuário autenticado; a imagem é opcional. Define um novo cookie accessToken após a atualização. / Updates supplied fields for the authenticated user; the image is optional. Sets a new accessToken cookie after the update.
            security:
                - AccessTokenCookie: []
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            $ref: '#/components/schemas/UserUpdateRequest'
            responses:
                '200':
                    description: Usuário atualizado e cookie renovado / User updated and cookie refreshed
                    headers:
                        Set-Cookie:
                            $ref: '#/components/headers/AccessTokenCookie'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HttpResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/NotFound'
                '409':
                    $ref: '#/components/responses/Conflict'
                '500':
                    $ref: '#/components/responses/ServerError'

components:
    securitySchemes:
        AccessTokenCookie:
            type: apiKey
            in: cookie
            name: accessToken
            description: Cookie HttpOnly emitido no cadastro/login. / HttpOnly cookie issued on registration/login.
    parameters:
        Id:
            name: id
            in: path
            required: true
            description: Identificador numérico / Numeric identifier
            schema:
                type: integer
                minimum: 1
    headers:
        AccessTokenCookie:
            description: Cookie de autenticação HttpOnly, Secure e SameSite=Lax. / HttpOnly, Secure, SameSite=Lax authentication cookie.
            schema:
                type: string
                example: accessToken=<token>; Path=/; HttpOnly; Secure; SameSite=Lax
    responses:
        BadRequest:
            description: Requisição inválida ou dados fora do formato aceito / Invalid request or data outside accepted format
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
        Unauthorized:
            description: Cookie ausente/inválido ou credenciais inválidas / Missing/invalid cookie or invalid credentials
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
        Forbidden:
            description: Ação não permitida para este usuário / Action not allowed for this user
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
        NotFound:
            description: Recurso não encontrado / Resource not found
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
        Conflict:
            description: Recurso conflitante, como e-mail ou pet já cadastrado / Conflicting resource, such as an already registered email or pet
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
        UnprocessableEntity:
            description: Estado do pet impede esta ação / Pet state prevents this action
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
        ServerError:
            description: Erro interno / Internal server error
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
    schemas:
        UserCreateRequest:
            type: object
            required: [name, email, phone, password, confirmPassword]
            properties:
                name:
                    type: string
                    description: Nome / Name
                    example: Ana Silva
                email:
                    type: string
                    format: email
                    description: E-mail / Email
                    example: ana@example.com
                phone:
                    type: string
                    pattern: '^(1[1-9]|2[1-35-9]|3[1-5789]|4[1-24-9]|5[1-5]|6[1-69]|7[1-69]|8[1-9]|9[15689])9\d{8}$'
                    description: Telefone com DDD, somente dígitos / Phone with area code, digits only
                    example: '11987654321'
                password:
                    type: string
                    minLength: 8
                    maxLength: 15
                    description: 8–15 caracteres, maiúscula, minúscula, número, símbolo e sem caracteres repetidos consecutivos. / 8–15 characters, uppercase, lowercase, number, symbol, and no consecutive repeated characters.
                    example: Senha@123
                confirmPassword:
                    type: string
                    description: Deve ser igual a password / Must match password
                    example: Senha@123
        LoginRequest:
            type: object
            required: [email, password]
            properties:
                email:
                    type: string
                    format: email
                    example: ana@example.com
                password:
                    type: string
                    description: Senha cadastrada / Registered password
                    example: Senha@123
        UserUpdateRequest:
            type: object
            description: Envie apenas os campos que deseja atualizar. / Send only the fields to update.
            properties:
                name:
                    type: string
                    description: Nome / Name
                email:
                    type: string
                    format: email
                    description: E-mail / Email
                phone:
                    type: string
                    description: Telefone com DDD, somente dígitos / Phone with area code, digits only
                password:
                    type: string
                    minLength: 8
                    maxLength: 15
                    description: Nova senha / New password
                confirmPassword:
                    type: string
                    description: Confirmação da nova senha / New password confirmation
                image:
                    type: string
                    format: binary
                    description: Imagem do perfil / Profile image
        PetCreateRequest:
            type: object
            required: [name, age, weight, color, images]
            properties:
                name:
                    type: string
                    description: Nome do pet / Pet name
                    example: Luna
                age:
                    type: string
                    description: Idade entre 0 e 50 / Age from 0 to 50
                    example: '3'
                weight:
                    type: string
                    description: Peso entre 0 e 160; aceita ponto ou vírgula decimal / Weight from 0 to 160; accepts dot or comma decimal separator
                    example: '12.5'
                color:
                    $ref: '#/components/schemas/PetColor'
                images:
                    type: array
                    minItems: 1
                    maxItems: 5
                    description: Uma a cinco imagens / One to five images
                    items:
                        type: string
                        format: binary
        PetUpdateRequest:
            type: object
            description: Envie apenas os campos que deseja atualizar. / Send only the fields to update.
            properties:
                name:
                    type: string
                    description: Nome / Name
                age:
                    type: string
                    description: Idade entre 0 e 50 / Age from 0 to 50
                weight:
                    type: string
                    description: Peso entre 0 e 160 / Weight from 0 to 160
                color:
                    $ref: '#/components/schemas/PetColor'
                images:
                    type: array
                    maxItems: 5
                    description: Até cinco imagens / Up to five images
                    items:
                        type: string
                        format: binary
        PetColor:
            type: string
            enum: [BRANCO, PRETO, CINZA, MARROM, CARAMELO, MALHADO]
            description: Cor válida / Valid color
            example: CARAMELO
        UserResponse:
            type: object
            required: [name, email, phone]
            properties:
                id:
                    type: integer
                    description: Identificador / Identifier
                    example: 12
                name:
                    type: string
                    example: Ana Silva
                email:
                    type: string
                    format: email
                    example: ana@example.com
                phone:
                    type: string
                    example: '11987654321'
                image:
                    type: string
                    format: uri
                    description: URL da imagem de perfil, quando disponível / Profile image URL, when available
        PetResponse:
            type: object
            required: [id, name, age, weight, color, images, available]
            properties:
                id:
                    type: integer
                    example: 24
                name:
                    type: string
                    example: Luna
                age:
                    type: integer
                    minimum: 0
                    maximum: 50
                    example: 3
                weight:
                    type: number
                    minimum: 0
                    maximum: 160
                    example: 12.5
                color:
                    $ref: '#/components/schemas/PetColor'
                images:
                    type: array
                    items:
                        type: string
                        format: uri
                available:
                    type: boolean
                    example: true
                adopterId:
                    type: integer
                    description: Identificador do adotante, quando definido / Adopter identifier, when set
                owner:
                    allOf:
                        - $ref: '#/components/schemas/UserResponse'
                    description: Dados do dono, quando incluídos pela operação / Owner details, when included by the operation
        HttpResponse:
            type: object
            required: [message, payload]
            properties:
                message:
                    type: string
                    example: Pet retrieved successfully / User retrieved successfully
                payload:
                    oneOf:
                        - $ref: '#/components/schemas/PetResponse'
                        - $ref: '#/components/schemas/UserResponse'
        PetListResponse:
            type: object
            required: [message, payload]
            properties:
                message:
                    type: string
                    example: Pets retrieved successfully
                payload:
                    type: array
                    items:
                        $ref: '#/components/schemas/PetResponse'
        ErrorResponse:
            type: object
            required: [message]
            properties:
                message:
                    type: string
                    description: Mensagem de erro / Error message
                    example: Pet not found
        MessageResponse:
            type: object
            required: [message]
            properties:
                message:
                    type: string
                    description: Resultado da operação / Operation result
                    example: Pet updated successfully
